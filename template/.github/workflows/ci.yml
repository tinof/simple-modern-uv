# Lint, type check, and test on every push and pull request.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: # Enable manual trigger.

permissions:
  contents: read

# Cancel superseded runs for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use only the checked-in resolution policy so ambient runner configuration cannot
  # make uv.lock appear stale or alter dependency selection.
  UV_CONFIG_FILE: uv.toml
  # Supply-chain cool-off: only consider releases older than this, so CI never
  # resolves packages too new to have been vetted. The uv line required by uv.toml
  # and pinned below accepts a relative duration directly. See the Supply Chain
  # Hardening section in docs/development.md.
  UV_EXCLUDE_NEWER: "14 days"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Update this as needed:
        # Common platforms: ["ubuntu-latest", "macos-latest", "windows-latest"]
        os: ["ubuntu-latest"]
        python-version: ["3.12", "3.13", "3.14", "3.15"]

    # Linux only by default. Use ${{ matrix.os }} for other OSes.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      # Generally following uv docs:
      # https://docs.astral.sh/uv/guides/integration/github/

      - name: Checkout (official GitHub action)
        # Pinned to a full commit SHA (see supply-chain notes in
        # docs/development.md); bump deliberately when updating.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Important for versioning plugins:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv (official Astral action)
        # Pinned to a full commit SHA. Bump the action, uv version, and Linux
        # checksum together when updating.
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Update this as needed:
          version: "0.13.1"
          # uv-x86_64-unknown-linux-gnu; update for another matrix OS/arch.
          checksum: "eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220"
          enable-cache: true
          # Retain downloaded wheels in the shared cache to reduce PyPI load.
          # This is setup-uv v9's default, made explicit for future upgrades.
          prune-cache: false
          python-version: ${{ matrix.python-version }}

      - name: Set up Python (using uv)
        run: uv python install

      # Alternately can use the official Python action:
      # Pin a reviewed full commit SHA before enabling it.
      # - name: Set up Python (using actions/setup-python)
      #   uses: actions/setup-python@FULL_COMMIT_SHA # reviewed version
      #   with:
      #     python-version: ${{ matrix.python-version }}

      - name: Install all dependencies
        # --locked: install from uv.lock and fail if pyproject.toml made it stale.
        # (UV_EXCLUDE_NEWER, set above, governs any resolution that does happen.)
        run: uv sync --locked --all-extras --all-groups

      # Same steps as `make check` (check-only: fails instead of fixing). Called
      # directly so the workflow also runs on runners without make.
      - name: Spell check
        run: uv run codespell src tests docs README.md AGENTS.md

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Check formatting
        run: uv run ruff format --check

      - name: Type check
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest
