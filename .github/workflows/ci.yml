# CI for the template repo itself: renders the template and exercises the renders,
# checks the update path from the previous release, and validates the agent skill.
# A green run on the merge commit is the release gate (see updating.md).

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned tool versions used to exercise the template. Keep the uv version in
  # sync with the template (the pin-consistency job checks this).
  UV_VERSION: "0.13.1"
  UV_CHECKSUM: "eadd9d27c134ab5ac1ffd4473b97a741407f3ea238288f03121fc4deddf90220"
  COPIER_SPEC: "copier@9.19.1"
  # Bun runs the npm-registry tools (bunx); see updating.md.
  BUN_VERSION: "1.4.3"
  # Default answers for test renders.
  RENDER_ARGS: >-
    --data package_name=smoke-test
    --data "package_description=Render smoke test"
    --data "package_author_name=Test Author"
    --data package_author_email=test@example.com
    --data package_github_org=testorg

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false
      - name: Check doc formatting
        run: make format-check

  render-test:
    strategy:
      matrix:
        include:
          - variant: default
            extra_args: ""
          - variant: no-publish-proprietary
            extra_args: "--data package_license=Proprietary --data publish_to_pypi=false"
          - variant: no-license
            extra_args: "--data package_license=None"
    runs-on: ubuntu-latest
    env:
      # Supply-chain cool-off for template dependency resolution, matching the
      # template's own CI and the Makefile default (see updating.md).
      UV_EXCLUDE_NEWER: "14 days"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: true
          # setup-uv v9 defaults to retaining wheels to reduce PyPI load. Keep
          # that tradeoff explicit so a future action default cannot change it.
          prune-cache: false
          python-version: "3.12"

      - name: Render template (${{ matrix.variant }})
        run: |
          eval uvx "$COPIER_SPEC" copy --defaults --vcs-ref=$GITHUB_SHA \
            $RENDER_ARGS ${{ matrix.extra_args }} "$GITHUB_WORKSPACE" /tmp/render

      - name: Inspect variant-specific output
        run: |
          cd /tmp/render
          case "${{ matrix.variant }}" in
            default)
              test -f .github/workflows/publish.yml
              test -f docs/publishing.md
              grep -q 'license = "MIT"' pyproject.toml
              head -1 LICENSE | grep -q "MIT License"
              # Only the commented-out form may appear in the default render:
              ! grep -qE '^\s*"Private :: Do Not Upload",' pyproject.toml
              grep -q 'uv sync --locked --all-extras --all-groups' \
                .github/workflows/ci.yml
              grep -q 'uv sync --locked --all-extras --all-groups' \
                .github/workflows/publish.yml
              grep -q 'UV_CONFIG_FILE: uv.toml' .github/workflows/ci.yml
              grep -q 'UV_CONFIG_FILE: uv.toml' .github/workflows/publish.yml
              grep -q 'enable-cache: false' .github/workflows/publish.yml
              ;;
            no-publish-proprietary)
              test ! -e .github/workflows/publish.yml
              test ! -e docs/publishing.md
              grep -q 'license = "LicenseRef-Proprietary"' pyproject.toml
              grep -qE '^\s*"Private :: Do Not Upload",' pyproject.toml
              ;;
            no-license)
              test ! -e LICENSE
              ! grep -qE '^license = ' pyproject.toml
              grep -q "No license chosen yet" pyproject.toml
              test -f .github/workflows/publish.yml
              ;;
          esac
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f uv.toml
          test -f .editorconfig
          test -f .github/dependabot.yml
          test -f src/smoke_test/__main__.py
          test -x .claude/hooks/session-start.sh
          python3 -m json.tool .claude/settings.json > /dev/null
          bash -n .claude/hooks/session-start.sh
          test ! -e devtools/lint.py
          grep -q 'requires-python = ">=3.12' pyproject.toml
          grep -q '## Working with a Coding Agent' README.md
          grep -q 'simple-modern-uv/tree/main/skills/simple-modern-uv' AGENTS.md
          grep -q 'required-version = ">=0.13.1,<0.14"' uv.toml
          grep -q 'exclude-newer = "14 days"' uv.toml
          ! grep -q '^\[tool\.uv\]' pyproject.toml
          grep -q 'UV_CONFIG_FILE := .*uv.toml' Makefile
          grep -q '@AGENTS.md' CLAUDE.md
          test -f .copier-answers.yml
          uvx flowmark-rs@0.3.2 --auto --check .

      - name: Init git and install (the documented setup sequence)
        # Mirrors the next-steps the template prints: commit first, then sync, so
        # dynamic versioning gives the editable install a real version.
        run: |
          cd /tmp/render
          export UV_CONFIG_FILE="$PWD/uv.toml"
          git init -q --initial-branch=main
          git add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "Initial commit"
          uv sync --all-extras --all-groups
          uv sync --locked --all-extras --all-groups
          V=$(uv run python -c "from importlib.metadata import version; print(version('smoke-test'))")
          echo "installed version: $V"
          test "$V" != "0.0.0"

      - name: Lint, test, build
        run: |
          cd /tmp/render
          export UV_CONFIG_FILE="$PWD/uv.toml"
          mkdir -p tests/review-fixtures
          cp "$GITHUB_WORKSPACE/.github/fixtures/ruff-markdown-input.txt" \
            tests/review-fixtures/ruff-markdown.md
          make check
          make test
          uv run python -m smoke_test
          git tag v0.1.0
          uv build --no-build-isolation
          ls dist/ | grep -q "smoke_test-0.1.0-py3-none-any.whl"

  update-path:
    # D2 "answer-schema evolution" rule 4: a project rendered from the previous
    # release must update cleanly to this commit. With --defaults the result must
    # converge to a fresh render (no conflicts, no surprise file changes), and
    # explicit --data overrides for newer questions must be honored.
    runs-on: ubuntu-latest
    env:
      UV_EXCLUDE_NEWER: "14 days"
      # Releases before v0.3 did not derive package_module from package_name, so
      # pass it explicitly to make old and fresh renders comparable.
      OLD_ARGS: "--data package_module=smoke_test"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_CHECKSUM }}
          enable-cache: false

      - name: Render from previous release tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$GITHUB_SHA")
          echo "Updating from $PREV_TAG to $GITHUB_SHA"
          eval uvx "$COPIER_SPEC" copy --defaults --vcs-ref="$PREV_TAG" \
            $RENDER_ARGS $OLD_ARGS "$GITHUB_WORKSPACE" /tmp/old
          cd /tmp/old
          git init -q --initial-branch=main
          git add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "From $PREV_TAG"

      - name: Update to candidate commit with defaults
        run: |
          cd /tmp/old
          eval uvx "$COPIER_SPEC" update --defaults --skip-answered \
            --vcs-ref=$GITHUB_SHA
          # No conflicts:
          REJ=$(find . -name '*.rej' | wc -l); test "$REJ" -eq 0
          # Converges to a fresh render of the candidate (the answers file differs
          # only by _commit/_src_path bookkeeping, so exclude it):
          eval uvx "$COPIER_SPEC" copy --defaults --vcs-ref=$GITHUB_SHA \
            $RENDER_ARGS "$GITHUB_WORKSPACE" /tmp/fresh
          diff -r --exclude=.git --exclude=.copier-answers.yml /tmp/old /tmp/fresh

      - name: Update honors --data overrides for newer questions
        run: |
          eval uvx "$COPIER_SPEC" copy --defaults \
            --vcs-ref="$(git describe --tags --abbrev=0 "$GITHUB_SHA")" \
            $RENDER_ARGS $OLD_ARGS "$GITHUB_WORKSPACE" /tmp/old2
          cd /tmp/old2
          git init -q --initial-branch=main
          git add -A
          git -c user.email=ci@example.com -c user.name=CI commit -qm "old"
          eval uvx "$COPIER_SPEC" update --defaults --skip-answered \
            --vcs-ref=$GITHUB_SHA --data publish_to_pypi=false
          test ! -e .github/workflows/publish.yml
          grep -qE '^\s*"Private :: Do Not Upload",' pyproject.toml

  pin-consistency:
    # Versions that must agree across files. A mismatch means a bump missed a copy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check uv, Copier, and build-backend pins agree
        run: |
          FAIL=0
          check() { if ! grep -qF -- "$2" "$1"; then echo "MISMATCH: $1 lacks $2"; FAIL=1; fi; }
          PUBLISH='template/.github/workflows/{% if publish_to_pypi %}publish.yml{% endif %}'
          for f in template/.github/workflows/ci.yml "$PUBLISH"; do
            check "$f" "version: \"$UV_VERSION\""
            check "$f" "checksum: \"$UV_CHECKSUM\""
          done
          check template/.claude/hooks/session-start.sh "UV_VERSION=\"$UV_VERSION\""
          check template/uv.toml "required-version = \">=$UV_VERSION,"
          # Every pinned Copier invocation uses the same version as CI.
          if grep -rnoE 'copier@[0-9.]+' --exclude-dir=.git . | grep -v "$COPIER_SPEC"; then
            echo "MISMATCH: Copier pins above differ from $COPIER_SPEC"; FAIL=1
          fi
          # Build backend pins must match between [build-system] and the build group.
          PY=template/pyproject.toml.jinja
          for dep in $(grep -oE '"(hatchling|uv-dynamic-versioning)==[0-9.]+"' "$PY" | sort -u); do
            test "$(grep -c -- "$dep" "$PY")" -eq 2 || { echo "MISMATCH: $dep"; FAIL=1; }
          done
          exit $FAIL

  skill-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bun (official Oven action)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Validate skill structure and frontmatter
        # No lifecycle scripts, and only package releases past the 14-day cool-off.
        run: >-
          bunx --ignore-scripts --minimum-release-age 1209600
          skills-ref@0.1.5 validate skills/simple-modern-uv
      - name: Check agent installation selects this repository's public skill
        run: grep -q -- '--skill simple-modern-uv --yes' README.md
      - name: Check that relative links in skill docs resolve
        run: |
          cd skills/simple-modern-uv
          FAIL=0
          for f in SKILL.md references/*.md; do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\(([^)#]+)\)' "$f" | sed 's/](\(.*\))/\1/'); do
              case "$link" in
                http*|mailto:*) continue ;;
              esac
              if [ ! -e "$dir/$link" ]; then
                echo "BROKEN: $f -> $link"; FAIL=1
              fi
            done
          done
          exit $FAIL
